name: Build MHAC ADMIN APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Android project
        run: |
          mkdir -p app/src/main/java/com/mhacdelivery/admin
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp MainActivity.java app/src/main/java/com/mhacdelivery/admin/MainActivity.java
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp mhac_logo.png app/src/main/res/drawable/mhac_logo.png
          cp styles.xml app/src/main/res/values/styles.xml

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mhacdelivery.admin'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mhacdelivery.admin'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.webkit:webkit:1.12.1'
          }
          EOF

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MHAC-ADMIN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
